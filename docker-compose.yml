name: ilikia-verao

services:
  web:
    image: nginx:alpine
    container_name: ilikia-verao-web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      - "traefik.http.routers.ilikia-verao.rule=Host(`ilikia-verao.koko.ag`)"
      - "traefik.http.routers.ilikia-verao.entrypoints=websecure"
      - "traefik.http.routers.ilikia-verao.tls=true"
      - "traefik.http.routers.ilikia-verao.tls.certresolver=cloudflare"
      - "traefik.http.routers.ilikia-verao.middlewares=security-headers@file,noindex@file"
      - "traefik.http.services.ilikia-verao.loadbalancer.server.port=80"
    volumes:
      # Servimos `www/`, NAO `out/`. O `next build` apaga e recria o `out/`
      # (inode novo), o que quebra o bind mount e obriga a recriar o container
      # — e cada recriacao abre uma janela em que o Traefik responde 404, que o
      # Cloudflare cacheia. O deploy faz rsync de out/ -> www/, entao o
      # diretorio montado nunca deixa de existir e nao precisa restart.
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

networks:
  proxy-network:
    external: true
    name: proxy-network
