server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Espelho koko.ag: noindex sempre ---
    # A LP cita marcas de terceiros (ex.: Hydrafacial). Espelho indexado sob
    # koko.ag ja gerou notificacao de marca em 19/07 — manter noindex aqui e o
    # middleware noindex@file no Traefik. Se precisar fechar de vez, ligar o
    # bloco auth_basic abaixo (htpasswd -nbB <user> <senha> > .htpasswd-dev).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # auth_basic "Koko Dev";
    # auth_basic_user_file /usr/share/nginx/html/.htpasswd-dev;

    location ~ /\.ht { deny all; return 404; }

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Hash no nome dos chunks do Next — cache longo e seguro.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|woff2?|otf|ttf|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location ~* \.woff2$ { default_type font/woff2; }
    location ~* \.otf$ { default_type font/otf; }
    location ~* \.webp$ { default_type image/webp; }
    location ~* \.mp4$ { default_type video/mp4; }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ $uri.html /index.html;
    }

    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
